name: Build Linux + linux-firmware

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version"
        required: true
        default: "7.2.2"

      firmware_version:
        description: "linux-firmware version"
        required: true
        default: "20260810"

      config_mode:
        description: "Kernel configuration"
        required: true
        type: choice
        default: "defconfig"
        options:
          - defconfig
          - allmodconfig

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Linux
    runs-on: ubuntu-24.04

    timeout-minutes: 360

    env:
      ARCH: x86_64
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      FIRMWARE_VERSION: ${{ inputs.firmware_version }}
      CONFIG_MODE: ${{ inputs.config_mode }}

    steps:
      # ---------------------------------------------------------------
      # Checkout our Arc build repository
      # ---------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # ---------------------------------------------------------------
      # Install kernel build dependencies
      # ---------------------------------------------------------------

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            dwarves \
            kmod \
            cpio \
            rsync \
            xz-utils \
            zstd \
            rdfind \
            tar \
            wget \
            perl \
            python3 \
            pkg-config

      # ---------------------------------------------------------------
      # Show runner information
      # ---------------------------------------------------------------

      - name: Show build machine
        run: |
          echo "CPU:"
          nproc
          lscpu

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Compiler:"
          gcc --version

      # ---------------------------------------------------------------
      # Prepare directories
      # ---------------------------------------------------------------

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sources"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      # ---------------------------------------------------------------
      # Download Linux
      # ---------------------------------------------------------------

      - name: Download Linux kernel
        working-directory: sources
        run: |
          MAJOR="${KERNEL_VERSION%%.*}"

          wget \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz"

          tar -xf "linux-${KERNEL_VERSION}.tar.xz"

      # ---------------------------------------------------------------
      # Download linux-firmware
      # ---------------------------------------------------------------

      - name: Download linux-firmware
        working-directory: sources
        run: |
          wget \
            "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-${FIRMWARE_VERSION}.tar.xz"

          tar -xf "linux-firmware-${FIRMWARE_VERSION}.tar.xz"

      # ---------------------------------------------------------------
      # Configure kernel
      # ---------------------------------------------------------------

      - name: Configure Linux kernel
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-${KERNEL_VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/linux"

          mkdir -p "$BUILD"

          if [ "$CONFIG_MODE" = "allmodconfig" ]; then
            echo "Using allmodconfig"

            make \
              -C "$SOURCE" \
              O="$BUILD" \
              ARCH=x86_64 \
              allmodconfig

            # Debug info is enormous and isn't necessary for our
            # normal distro package.
            "$SOURCE/scripts/config" \
              --file "$BUILD/.config" \
              --disable DEBUG_INFO \
              --enable DEBUG_INFO_NONE \
              --disable WERROR

            make \
              -C "$SOURCE" \
              O="$BUILD" \
              ARCH=x86_64 \
              olddefconfig
          else
            echo "Using x86_64 defconfig"

            make \
              -C "$SOURCE" \
              O="$BUILD" \
              ARCH=x86_64 \
              x86_64_defconfig
          fi

          # Give Arc's kernel its own release suffix.
          "$SOURCE/scripts/config" \
            --file "$BUILD/.config" \
            --set-str LOCALVERSION "-mcx"

          make \
            -C "$SOURCE" \
            O="$BUILD" \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "Kernel configuration:"
          grep CONFIG_LOCALVERSION "$BUILD/.config"

      # ---------------------------------------------------------------
      # Build the actual kernel
      # ---------------------------------------------------------------

      - name: Compile Linux kernel
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-${KERNEL_VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/linux"

          make \
            -C "$SOURCE" \
            O="$BUILD" \
            ARCH=x86_64 \
            -j"$(nproc)"

      # ---------------------------------------------------------------
      # Get generated kernel version
      # ---------------------------------------------------------------

      - name: Determine kernel release
        id: kernel
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-${KERNEL_VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/linux"

          RELEASE="$(
            make \
              -s \
              -C "$SOURCE" \
              O="$BUILD" \
              ARCH=x86_64 \
              kernelrelease
          )"

          echo "Kernel release: $RELEASE"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Install kernel image
      # ---------------------------------------------------------------

      - name: Stage kernel
        run: |
          BUILD="$GITHUB_WORKSPACE/build/linux"
          ROOT="$GITHUB_WORKSPACE/pkg/linux"

          mkdir -p "$ROOT/boot"

          install \
            -Dm644 \
            "$BUILD/arch/x86/boot/bzImage" \
            "$ROOT/boot/vmlinuz-${{ steps.kernel.outputs.release }}"

          install \
            -Dm644 \
            "$BUILD/System.map" \
            "$ROOT/boot/System.map-${{ steps.kernel.outputs.release }}"

          install \
            -Dm644 \
            "$BUILD/.config" \
            "$ROOT/boot/config-${{ steps.kernel.outputs.release }}"

      # ---------------------------------------------------------------
      # Install kernel modules
      # ---------------------------------------------------------------

      - name: Stage kernel modules
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-${KERNEL_VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/linux"
          ROOT="$GITHUB_WORKSPACE/pkg/linux"

          make \
            -C "$SOURCE" \
            O="$BUILD" \
            ARCH=x86_64 \
            INSTALL_MOD_PATH="$ROOT" \
            modules_install

          # These links point back into the build environment and
          # shouldn't be shipped in the binary package.
          rm -f \
            "$ROOT/lib/modules/${{ steps.kernel.outputs.release }}/build" \
            "$ROOT/lib/modules/${{ steps.kernel.outputs.release }}/source"

      # ---------------------------------------------------------------
      # Install userspace Linux API headers
      # ---------------------------------------------------------------

      - name: Stage Linux API headers
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-${KERNEL_VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/linux"
          ROOT="$GITHUB_WORKSPACE/pkg/linux-api-headers"

          mkdir -p "$ROOT/usr"

          make \
            -C "$SOURCE" \
            O="$BUILD" \
            ARCH=x86_64 \
            INSTALL_HDR_PATH="$ROOT/usr" \
            headers_install

      # ---------------------------------------------------------------
      # Stage linux-firmware
      # ---------------------------------------------------------------

      - name: Stage linux-firmware
        run: |
          SOURCE="$GITHUB_WORKSPACE/sources/linux-firmware-${FIRMWARE_VERSION}"
          ROOT="$GITHUB_WORKSPACE/pkg/linux-firmware"

          make \
            -C "$SOURCE" \
            -j"$(nproc)" \
            DESTDIR="$ROOT" \
            install

          make \
            -C "$SOURCE" \
            DESTDIR="$ROOT" \
            dedup

      # ---------------------------------------------------------------
      # Inspect results
      # ---------------------------------------------------------------

      - name: Show package sizes
        run: |
          echo "Kernel:"
          du -sh "$GITHUB_WORKSPACE/pkg/linux"

          echo
          echo "API headers:"
          du -sh "$GITHUB_WORKSPACE/pkg/linux-api-headers"

          echo
          echo "Firmware:"
          du -sh "$GITHUB_WORKSPACE/pkg/linux-firmware"

          echo
          df -h

      # ---------------------------------------------------------------
      # Package everything as tar.zst
      # ---------------------------------------------------------------

      - name: Create Arc package archives
        run: |
          DIST="$GITHUB_WORKSPACE/dist"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$GITHUB_WORKSPACE/pkg/linux" \
            -cf "$DIST/linux-${{ steps.kernel.outputs.release }}-x86_64.tar.zst" \
            .

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$GITHUB_WORKSPACE/pkg/linux-api-headers" \
            -cf "$DIST/linux-api-headers-${KERNEL_VERSION}-x86_64.tar.zst" \
            .

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$GITHUB_WORKSPACE/pkg/linux-firmware" \
            -cf "$DIST/linux-firmware-${FIRMWARE_VERSION}-any.tar.zst" \
            .

      # ---------------------------------------------------------------
      # Generate SHA-256 checksums
      # ---------------------------------------------------------------

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.zst > SHA256SUMS

          cat SHA256SUMS

      # ---------------------------------------------------------------
      # Upload results to GitHub
      # ---------------------------------------------------------------

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: arc-linux-${{ steps.kernel.outputs.release }}
          path: dist/*
          compression-level: 0
          retention-days: 7
