name: Build coreutils 9.11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      VERSION: "9.11"
      PKGNAME: "coreutils"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gettext \
            perl \
            python3 \
            libacl1-dev \
            libattr1-dev \
            libcap-dev \
            libselinux1-dev \
            libgmp-dev \
            pkg-config \
            wget \
            tar \
            xz-utils \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download coreutils
        working-directory: src
        run: |
          set -euxo pipefail

          wget \
            "https://ftp.gnu.org/gnu/coreutils/coreutils-${VERSION}.tar.xz"

          tar -xf "coreutils-${VERSION}.tar.xz"

      - name: Configure coreutils
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/coreutils-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/coreutils"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --enable-install-program=hostname

      - name: Build coreutils
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/coreutils" -j"$(nproc)"

      - name: Stage coreutils
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/coreutils"

          make \
            -C "$GITHUB_WORKSPACE/build/coreutils" \
            DESTDIR="$ROOT" \
            install

          # Conventional FHS compatibility links for early userspace.
          mkdir -p "$ROOT/bin"

          for cmd in cat chgrp chmod chown cp date dd df echo false ln ls mkdir \
                     mknod mv pwd rm rmdir sleep stty sync true uname; do
            if [ -e "$ROOT/usr/bin/$cmd" ]; then
              ln -sf "../usr/bin/$cmd" "$ROOT/bin/$cmd"
            fi
          done

          echo "Installed commands:"
          find "$ROOT/usr/bin" -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          du -sh "$ROOT"

      - name: Package coreutils
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/coreutils"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload coreutils artifact
        uses: actions/upload-artifact@v6
        with:
          name: coreutils-9.11-x86_64
          path: dist/coreutils-9.11-x86_64.tar.zst
          compression-level: 0
          retention-days: 7
