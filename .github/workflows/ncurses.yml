name: Build ncurses 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      VERSION: "6.6"
      PKGNAME: "ncurses"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            pkg-config \
            wget \
            tar \
            gzip \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download ncurses
        working-directory: src
        run: |
          set -euxo pipefail
          wget "https://invisible-mirror.net/archives/ncurses/ncurses-${VERSION}.tar.gz"
          tar -xzf "ncurses-${VERSION}.tar.gz"

      - name: Configure ncurses
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/ncurses-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/ncurses"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --mandir=/usr/share/man \
            --with-shared \
            --with-normal \
            --with-cxx-shared \
            --enable-widec \
            --with-termlib \
            --with-ticlib \
            --enable-pc-files \
            --with-pkg-config-libdir=/usr/lib/pkgconfig \
            --enable-ext-colors \
            --enable-ext-mouse \
            --enable-sp-funcs \
            --enable-sigwinch

      - name: Build ncurses
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/ncurses" -j"$(nproc)"

      - name: Stage ncurses
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/ncurses"

          make \
            -C "$GITHUB_WORKSPACE/build/ncurses" \
            DESTDIR="$ROOT" \
            install

          # Preserve all installed libraries, utilities, headers, pkg-config
          # files, man pages and the terminfo database.
          find "$ROOT" -type f -o -type l | sort | head -200
          du -sh "$ROOT"

      - name: Package ncurses
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/ncurses"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload ncurses artifact
        uses: actions/upload-artifact@v6
        with:
          name: ncurses-6.6-x86_64
          path: dist/ncurses-6.6-x86_64.tar.zst
          compression-level: 0
          retention-days: 7
