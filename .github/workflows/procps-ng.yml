name: Build procps-ng 4.0.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      VERSION: "4.0.7"
      PKGNAME: "procps-ng"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install full build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gettext \
            libncurses-dev \
            libsystemd-dev \
            libselinux1-dev \
            libnuma-dev \
            wget \
            tar \
            xz-utils \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download procps-ng
        working-directory: src
        run: |
          set -euxo pipefail

          wget \
            "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-${VERSION}.tar.xz"

          tar -xf "procps-ng-${VERSION}.tar.xz"

      - name: Configure procps-ng
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/procps-ng-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/procps-ng"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --bindir=/usr/bin \
            --sbindir=/usr/sbin \
            --libdir=/usr/lib \
            --sysconfdir=/etc \
            --enable-static \
            --enable-shared \
            --enable-watch8bit \
            --with-systemd

      - name: Build procps-ng
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/procps-ng" -j"$(nproc)"

      - name: Stage procps-ng
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/procps-ng"

          make \
            -C "$GITHUB_WORKSPACE/build/procps-ng" \
            DESTDIR="$ROOT" \
            install

          echo "=== Installed procps-ng files ==="
          find "$ROOT" \( -type f -o -type l \) | sort | sed -n '1,250p'

          echo
          echo "=== Package size ==="
          du -sh "$ROOT"

      - name: Package procps-ng
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/procps-ng"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh "$OUT" "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Upload procps-ng artifact
        uses: actions/upload-artifact@v6
        with:
          name: procps-ng-4.0.7-x86_64
          path: |
            dist/procps-ng-4.0.7-x86_64.tar.zst
            dist/procps-ng-4.0.7-x86_64.tar.zst.sha256
          compression-level: 0
          retention-days: 7
