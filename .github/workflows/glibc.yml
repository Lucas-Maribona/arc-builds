name: Build glibc 2.44

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VERSION: "2.44"
      LINUX_VERSION: "7.2.2"
      PKGNAME: "glibc"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            binutils \
            make \
            gawk \
            bison \
            python3 \
            texinfo \
            gettext \
            sed \
            grep \
            perl \
            wget \
            tar \
            xz-utils \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/kernel-headers"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download glibc
        working-directory: src
        run: |
          set -euxo pipefail
          wget "https://ftp.gnu.org/gnu/glibc/glibc-${VERSION}.tar.xz"
          tar -xf "glibc-${VERSION}.tar.xz"

      - name: Download Linux headers
        working-directory: src
        run: |
          set -euxo pipefail

          MAJOR="${LINUX_VERSION%%.*}"

          wget \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf "linux-${LINUX_VERSION}.tar.xz"

      - name: Install Linux API headers for glibc
        run: |
          set -euxo pipefail

          make \
            -C "$GITHUB_WORKSPACE/src/linux-${LINUX_VERSION}" \
            ARCH=x86_64 \
            headers_install \
            INSTALL_HDR_PATH="$GITHUB_WORKSPACE/kernel-headers"

      - name: Configure glibc
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/glibc-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/glibc"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --with-headers="$GITHUB_WORKSPACE/kernel-headers/include" \
            --enable-stack-protector=strong \
            --enable-bind-now \
            --enable-static-pie \
            --enable-cet \
            --enable-fortify-source=3 \
            --disable-werror

      - name: Build glibc
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/glibc" -j"$(nproc)"

      - name: Stage glibc
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/glibc"

          mkdir -p "$ROOT"

          make \
            -C "$GITHUB_WORKSPACE/build/glibc" \
            DESTDIR="$ROOT" \
            install

          # Generate and install the complete locale set as well.
          make \
            -C "$GITHUB_WORKSPACE/build/glibc" \
            DESTDIR="$ROOT" \
            localedata/install-locales

          # Linux API headers are part of the libc development interface.
          # Copy them in without overwriting headers supplied by glibc.
          cp -a -n \
            "$GITHUB_WORKSPACE/kernel-headers/include/." \
            "$ROOT/usr/include/"

          find "$ROOT" -maxdepth 3 -type f -o -type l | sort | head -250
          du -sh "$ROOT"

      - name: Package glibc
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/glibc"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload glibc artifact
        uses: actions/upload-artifact@v6
        with:
          name: glibc-2.44-x86_64
          path: dist/glibc-2.44-x86_64.tar.zst
          compression-level: 0
          retention-days: 7
