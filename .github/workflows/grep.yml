name: Build GNU grep 3.12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      VERSION: "3.12"
      PKGNAME: "grep"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install full build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gettext \
            libpcre2-dev \
            libselinux1-dev \
            libacl1-dev \
            libattr1-dev \
            wget \
            tar \
            xz-utils \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download GNU grep
        working-directory: src
        run: |
          set -euxo pipefail

          wget \
            "https://ftp.gnu.org/gnu/grep/grep-${VERSION}.tar.xz"

          tar -xf "grep-${VERSION}.tar.xz"

      - name: Configure GNU grep
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/grep-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/grep"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --bindir=/usr/bin \
            --sysconfdir=/etc

      - name: Build GNU grep
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/grep" -j"$(nproc)"

      - name: Stage GNU grep
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/grep"

          make \
            -C "$GITHUB_WORKSPACE/build/grep" \
            DESTDIR="$ROOT" \
            install

          echo "=== grep build features ==="
          "$GITHUB_WORKSPACE/build/grep/src/grep" --version

          echo
          echo "=== Installed files ==="
          find "$ROOT" \( -type f -o -type l \) | sort | sed -n '1,200p'

          echo
          du -sh "$ROOT"

      - name: Package GNU grep
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/grep"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh "$OUT" "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Upload GNU grep artifact
        uses: actions/upload-artifact@v6
        with:
          name: grep-3.12-x86_64
          path: |
            dist/grep-3.12-x86_64.tar.zst
            dist/grep-3.12-x86_64.tar.zst.sha256
          compression-level: 0
          retention-days: 7
