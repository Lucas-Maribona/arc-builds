name: Build GNU sed 4.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      VERSION: "4.10"
      PKGNAME: "sed"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install full build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gettext \
            libselinux1-dev \
            libacl1-dev \
            libattr1-dev \
            wget \
            tar \
            xz-utils \
            zstd

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Download GNU sed
        working-directory: src
        run: |
          set -euxo pipefail

          wget \
            "https://ftp.gnu.org/gnu/sed/sed-${VERSION}.tar.xz"

          tar -xf "sed-${VERSION}.tar.xz"

      - name: Configure GNU sed
        run: |
          set -euxo pipefail

          SOURCE="$GITHUB_WORKSPACE/src/sed-${VERSION}"
          BUILD="$GITHUB_WORKSPACE/build/sed"

          mkdir -p "$BUILD"
          cd "$BUILD"

          "$SOURCE/configure" \
            --prefix=/usr \
            --bindir=/usr/bin \
            --sysconfdir=/etc

      - name: Build GNU sed
        run: |
          set -euxo pipefail
          make -C "$GITHUB_WORKSPACE/build/sed" -j"$(nproc)"

      - name: Stage GNU sed
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/sed"

          make \
            -C "$GITHUB_WORKSPACE/build/sed" \
            DESTDIR="$ROOT" \
            install

          echo "=== sed version ==="
          "$GITHUB_WORKSPACE/build/sed/sed/sed" --version

          echo
          echo "=== Installed files ==="
          find "$ROOT" \( -type f -o -type l \) | sort | sed -n '1,200p'

          echo
          du -sh "$ROOT"

      - name: Package GNU sed
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/pkg/sed"
          OUT="$GITHUB_WORKSPACE/dist/${PKGNAME}-${VERSION}-x86_64.tar.zst"

          tar \
            --use-compress-program="zstd -10 -T0" \
            -C "$ROOT" \
            -cf "$OUT" \
            .

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh "$OUT" "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Upload GNU sed artifact
        uses: actions/upload-artifact@v6
        with:
          name: sed-4.10-x86_64
          path: |
            dist/sed-4.10-x86_64.tar.zst
            dist/sed-4.10-x86_64.tar.zst.sha256
          compression-level: 0
          retention-days: 7
